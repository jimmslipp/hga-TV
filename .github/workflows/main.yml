name: Build HGA-Media APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Unpack the project
        run: |
          COUNT=$(ls -1 *.zip 2>/dev/null | wc -l)
          echo "--- zip files found: $COUNT ---"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: need exactly one .zip at the top level of the repo."
            ls -la
            exit 1
          fi
          ZIP=$(ls -1 *.zip)
          echo "Using: $ZIP"
          rm -rf _src && mkdir _src
          unzip -oq "$ZIP" -d _src
          FOUND=$(find _src -name settings.gradle | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: no project found inside the zip."
            find _src -maxdepth 3 -type d
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "--- building from: $DIR ---"
          cat "$DIR/BUILD-STAMP.txt" || echo "WARNING: no stamp - old zip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build the app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon > "$GITHUB_WORKSPACE/build.log" 2>&1 || true
          if grep -q "BUILD SUCCESSFUL" "$GITHUB_WORKSPACE/build.log"; then
            echo "BUILD SUCCESSFUL"
            exit 0
          fi
          echo ""
          echo "=========== COPY EVERYTHING BELOW THIS LINE ==========="
          grep -E "^e: |ERROR|error:|What went wrong|FAILURE|Caused by|AAPT" "$GITHUB_WORKSPACE/build.log" | head -40
          echo "=========== COPY EVERYTHING ABOVE THIS LINE ==========="
          exit 1

      - name: Save the full log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Give the file a friendly name
        run: |
          mkdir -p out
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" out/HGA-Media.apk
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: HGA-Media-APK
          path: out/HGA-Media.apk
          retention-days: 90
